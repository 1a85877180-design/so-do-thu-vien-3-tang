<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Sơ đồ thư viện 3 tầng</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; margin: 0; background: #f2f2f2; }
  h1 { background: #004080; color: white; margin: 0; padding: 15px 0; }
  .floor-buttons { margin: 20px 0; }
  button {
    background-color: #0078d7; color: white; border: none; padding: 10px 20px;
    margin: 0 5px; border-radius: 5px; cursor: pointer; font-size: 16px;
  }
  button:hover { background-color: #005a9e; }
  #map-container {
    margin: 0 auto; width: 95%; height: 80vh;
    border: 2px solid #ccc; background: white;
    overflow: auto;
  }
</style>
</head>
<body>

<h1>Sơ đồ thư viện 3 tầng</h1>

<div class="floor-buttons">
  <button onclick="showFloor('tang1.html')">Tầng 1</button>
  <button onclick="showFloor('tang2.html')">Tầng 2</button>
  <button onclick="showFloor('tang3.html')">Tầng 3</button>
</div>

<div id="map-container">
  <p>Đang tải sơ đồ...</p>
</div>

<script>
async function showFloor(file) {
  const container = document.getElementById('map-container');
  container.innerHTML = '<p>Đang tải sơ đồ...</p>';
  try {
    const response = await fetch(file);
    if (!response.ok) throw new Error('Không tải được file: ' + file);
    const html = await response.text();
    container.innerHTML = html;
  } catch (err) {
    container.innerHTML = `<p style="color:red;">Lỗi tải ${file}: ${err.message}</p>`;
  }
}
// Hiển thị mặc định tầng 1
showFloor('tang1.html');
</script>

</body>
</html>
